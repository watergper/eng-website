<!DOCTYPE html>
<html lang="en"></html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Hassan Yunus"> 
    <title>OCTAGAME</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <div id="navbar"></div>
    <script src="app.js"></script>
    <main>

        <div class="main__container">
            <div class="main__content">
                <h1>OCTOGAME</h1>
                <h2>University Simulator</h2>
                <p>Take five minutes to imagine your ideal university campus! Focus on making it a fun, vibrant place where students can truly enjoy themselves.</p>
            </div>
            <div class="main__img--container">
                <img src="images/pic1.svg" alt="" id="main__img">
            </div>
        </div>

        <section class="github-repo">
            <h1>GitHub Repository</h1>
            <h3><a href="https://github.com/DragonWarrior12/UniSim8-Group1" target="_blank">Link to Repository</a></h3>
          </section>
    </main>

    <script>
        fetch('navbar.html')
          .then(response => response.text())
          .then(data => document.getElementById('navbar').innerHTML = data);
    </script>
</body>

</html>
